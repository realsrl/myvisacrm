{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Iniciar Sesión | Visa Management{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-passport fa-3x text-primary mb-3"></i>
                    <h3 class="fw-bold">Bienvenido a VisaPower</h3>
                    <p class="text-muted">Inicia sesión en tu cuenta para continuar</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">Iniciar Sesión</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
